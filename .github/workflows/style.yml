name: style

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests for the style tools
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check drivers, apps and manifests against STYLE.md
        run: python3 scripts/check_style.py
